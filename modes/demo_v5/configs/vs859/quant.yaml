model:
  onnx_model: modes/demo_v5/model/yolov5n_detect_standingperson_ball_board_ballhoop_704_1280_20250707_headcut_raw.onnx

work_mode: PTQ

quant:
  activation:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
  weight:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
    per_channel: True

dataset:
  calibrate:
    root: modes/basketball/datasets/calibration/images
    calibrate_num_sampler: 20
    batch_size: 1
    num_worker: 4
  transform:
    resize: [704, 1280]
    crop: [704, 1280]
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

out_dir: modes/demo_v5/outputs/quant/

project: cv7
template_dir: auto  # Generate the Makefile in outputs/compile/ambarella/work.
adk_path: /opt/cvtools/sample_nn_diag/diags/onnx/yolo_v8_s_ox/../../../../adk
framework_dir: dependencies/ambacv
model: modes/demo_v5/model/yolov5n_detect_standingperson_ball_board_ballhoop_704_1280_20250707_headcut_raw.onnx
prefer_headcut: true
network: demo_v5_yolov5
input:
  images: modes/basketball/datasets/calibration/images
  sample_count: 20
  color_format: 1
  scale: 255.0
  yuv420: true
  roi_scale: 0
  roi_x: 9999
  roi_y: 9999
dra:
  # mode: 2 = DRA v2, 3 = DRA v3.
  mode: 2
  # Use comma-separated options. DRA v2 supports type=histo/minmax and
  # coverage_th/coverage_recover_th; DRA v3 supports slope_psnr_end.
  # Precision can be forced with act-force-* and coeff-force-* (fx8/fx16/fp16)
  # or relaxed with act-allow-fp16 and coeff-allow-fp16. Coverage options do
  # not apply when activation/coefficient precision is forced.
  options: act-force-fx8,coeff-force-fx8
io:
  mode: 1
output:
  dram_pitch_alignment: 1
output_dir: modes/demo_v5/outputs/compile/ambarella

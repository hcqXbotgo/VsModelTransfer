model: modes/soccer/outputs/compile/rk3576/soccer_rk3576.rknn
build_config: modes/soccer/configs/rk3576/rknn.yaml

runtime:
  target: null
  device_id: null
  verbose: false
  perf_debug: false
  eval_mem: false

dataset:
  ann_file: modes/basketball/datasets/evaluation/annotations/instances.json
  img_dir: modes/basketball/datasets/evaluation/images
  input_size: [1024, 3328]
  color_order: RGB
  num_samples: 0
  sequence_length: 3
  frame_step: 1
  sequence_stride: 1
  split_inputs: true

decode:
  mode: yolov8_headcut
  conf_threshold: 0.001
  iou_threshold: 0.3
  # The temporary basketball annotations compare person and ball only.
  class_map: {0: 1, 1: 2}

output:
  result_file: modes/soccer/outputs/evaluation/rk3576/metric_result.csv
  predictions_file: modes/soccer/outputs/evaluation/rk3576/predictions.json
  vis_dir: modes/soccer/outputs/evaluation/rk3576/visualizations
  vis_num: 20
  vis_conf_threshold: 0.25
  vis_max_boxes: 100

model:
  onnx_model: modes/soccer/model/yolov5n_falcon2_3328_1024_clean_headcut_raw.onnx

target_platform: rk3576
do_quantization: true

quant:
  dtype: w8a8
  algorithm: normal
  method: channel
  hybrid_level: 0
  auto_hybrid: false

build:
  optimization_level: 3
  float_dtype: float16

dataset:
  root: modes/basketball/datasets/calibration/images
  sample_count: 14

preprocess:
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

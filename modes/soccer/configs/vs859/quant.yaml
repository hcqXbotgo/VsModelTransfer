cfg_version: 0.3

model:
  onnx_model: modes/soccer/model/yolov8n_detect-auxHM-seq-stack-3f_sperson_ball_goal_h3328_w3328_20260825_best_headcut_raw.onnx

work_mode: PTQ

quant:
  activation:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
  weight:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
    per_channel: True

dataset:
  calibrate:
    type: Custom
    source: common/evaluation/coco_loader.py
    target: statlasquant_calibrate_dataloader
    parameters:
      root: modes/soccer/datasets/calibration
      resize_size: [1024, 3328]
      crop_size: [1024, 3328]
      normalize_mean: [0.0, 0.0, 0.0]
      normalize_std: [1.0, 1.0, 1.0]
      sequence_length: 3
      frame_step: 1
      sequence_stride: 1
      split_inputs: false
      calibrate_num_sampler: 14
      batch_size: 1
      # Large 9-channel frames are more reliable with a single worker.
      num_workers: 0
    # Each calibration sample is [frame_i, frame_i+1, frame_i+2].
    # The model predicts boxes for frame_i (the first frame).
  # Keep the transform section for StatlasQuant's config validation.
  # The custom loader receives the explicit parameters above.
  transform:
    resize: [1024, 3328]
    crop: [1024, 3328]
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

out_dir: modes/soccer/outputs/quant/

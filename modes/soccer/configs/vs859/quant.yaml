model:
  onnx_model: modes/soccer/model/yolov5n_falcon2_3328_1024_clean_headcut_raw.onnx

work_mode: PTQ

quant:
  activation:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
  weight:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
    per_channel: True

dataset:
  calibrate:
    root: modes/basketball/datasets/calibration/images
    calibrate_num_sampler: 14
    batch_size: 1
    num_worker: 4
  transform:
    resize: [1024, 3328]
    crop: [1024, 3328]
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

out_dir: modes/soccer/outputs/quant/

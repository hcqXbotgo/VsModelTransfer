project: cv7
template_dir: auto  # Generate the Makefile in outputs/compile/ambarella/work.
adk_path: /opt/cvtools/sample_nn_diag/diags/onnx/yolo_v8_s_ox/../../../../adk
framework_dir: dependencies/ambacv
model: modes/soccer/model/yolov8n_detect-auxHM-seq-stack-3f_sperson_ball_goal_h3328_w3328_20260825_best_headcut_raw.onnx
prefer_headcut: true
network: soccer_yolov8_seq
input:
  images: modes/soccer/datasets/calibration
  sample_count: 20
  color_format: 1
  scale: 255.0
dra:
  # mode: 2 = DRA v2, 3 = DRA v3.
  mode: 2
  # Comma-separated options: v2 supports type=histo/minmax and coverage
  # thresholds; v3 supports slope_psnr_end. Precision can be forced with
  # act-force-* / coeff-force-* (fx8/fx16/fp16). Forced formats disable the
  # coverage threshold options.
  options: act-force-fx8,coeff-force-fx8
# The sequence model has three independent image tensors. PICINFO describes one
# image pyramid, so keep tensor input mode while sharing basketball's FX8 policy.
io:
  mode: 2
output:
  dram_pitch_alignment: 1
output_dir: modes/soccer/outputs/compile/ambarella

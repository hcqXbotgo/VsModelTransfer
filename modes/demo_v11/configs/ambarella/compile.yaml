project: cv7
template_dir: auto  # Generate the Makefile in outputs/compile/ambarella/work.
adk_path: /opt/cvtools/sample_nn_diag/diags/onnx/yolo_v8_s_ox/../../../../adk
framework_dir: dependencies/ambacv
model: modes/demo_v11/model/yolo11n_detect_sperson_ball_hoop_ballhoop_h1024_w3328_20260720_best_opset13_fp32_headcut_raw.onnx
prefer_headcut: true
model_category: yolov11
input:
  images: modes/basketball/datasets/calibration/images
  sample_count: 20
  color_format: 1
  scale: 255.0
  yuv420: true
  roi_scale: 0
  roi_x: 9999
  roi_y: 9999
dra:
  # mode: 2 = DRA v2, 3 = DRA v3.
  mode: 2
  # Comma-separated options: v2 supports type=histo/minmax and coverage
  # thresholds; v3 supports slope_psnr_end. act-force-* / coeff-force-* can
  # force fx8, fx16, or fp16. Coverage thresholds are ignored when forced.
  options: act-force-fx8,coeff-force-fx8
io:
  mode: 1
output:
  dram_pitch_alignment: 1
output_dir: modes/demo_v11/outputs/compile/ambarella

model:
  onnx_model: modes/demo_v11/model/yolo11n_opset13_fp32.onnx

work_mode: PTQ

automix: 
   bitwidth_list: [8,16] 
   algo: naive

dataset:
  calibrate:
    root: modes/soccer/datasets/calibration/images
    calibrate_num_sampler: 14
    batch_size: 1
    num_worker: 4
  transform:
    resize: [1024, 3328]
    crop: [1024, 3328]
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

out_dir: modes/demo_v11/outputs/quant/

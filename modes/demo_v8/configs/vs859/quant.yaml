model:
  onnx_model: modes/demo_v8/model/yolov8n_detect_sperson_ball_hoop_ballhoop_h960_w960_20260720-2_best_opset13_fp32_cut_raw_headcut_raw.onnx

work_mode: PTQ

quant:
  activation:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
  weight:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
    per_channel: True

dataset:
  calibrate:
    root: modes/basketball/datasets/calibration/images
    calibrate_num_sampler: 10
    batch_size: 1
    num_worker: 4
  transform:
    resize: [960, 960]
    crop: [960, 960]
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

out_dir: modes/demo_v8/outputs/quant/

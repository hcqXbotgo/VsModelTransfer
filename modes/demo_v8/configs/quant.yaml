model:
  onnx_model: /home/dragonfly/wj_sdk/quant_folder/modes/demo_v8/model/yolov8n.onnx

work_mode: PTQ

quant:
  activation:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
  weight:
    observer: MinMaxObserver
    dtype: int8
    symmetry: True
    per_channel: True

dataset:
  calibrate:
    root: modes/soccer/datasets/calibration/images
    calibrate_num_sampler: 10
    batch_size: 1
    num_worker: 4
  transform:
    resize: [640, 640]
    crop: [640, 640]
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

out_dir: modes/demo_v8/outputs/quant/

project: cv7
template_dir: auto  # Generate the Makefile in outputs/compile/ambarella/work.
adk_path: /opt/cvtools/sample_nn_diag/diags/onnx/yolo_v8_s_ox/../../../../adk
framework_dir: dependencies/ambacv
model: modes/demo_v8/model/yolov8n_detect_sperson_ball_hoop_ballhoop_h960_w960_20260720-2_best_opset13_fp32_cut_raw_headcut_raw.onnx
prefer_headcut: true
network: demo_v8_yolov8
input:
  images: modes/basketball/datasets/calibration/images
  sample_count: 20
  color_format: 1
  scale: 255.0
  yuv420: true
  roi_scale: 0
  roi_x: 9999
  roi_y: 9999
dra:
  # mode: 2 = DRA v2, 3 = DRA v3.
  mode: 2
  # Comma-separated DRA options. v2: type=histo/minmax,
  # coverage_th/coverage_recover_th. v3: slope_psnr_end. Data formats may be
  # forced with act-force-* and coeff-force-* (fx8/fx16/fp16).
  options: act-force-fx8,coeff-force-fx8
io:
  mode: 1
output:
  dram_pitch_alignment: 1
output_dir: modes/demo_v8/outputs/compile/ambarella

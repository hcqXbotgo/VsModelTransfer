# Ambarella CV7/CV72 CVFlow build configuration.
project: cv7
template_dir: auto  # Generate the Makefile in outputs/compile/ambarella/work.
adk_path: /opt/cvtools/sample_nn_diag/diags/onnx/yolo_v8_s_ox/../../../../adk
framework_dir: dependencies/ambacv
model: modes/basketball/model/yolov8n_detect_sperson_ball_hoop_ballhoop_h3328_w3328_20260818_best.onnx
prefer_headcut: true
model_category: yolov8
# Optional Ambarella simple-pruning ratio.  Uncomment to prune this fraction
# of eligible weights during CVFlow compilation (0.0 to 1.0).
# model_prune: 0.5
input:
  images: modes/basketball/datasets/calibration/images
  sample_count: 20
  color_format: 1
  scale: 255.0
  # Generate the two-plane Y/UV picinfo input and let ADK insert its native
  # NV12-to-RGB preprocessing node before the RGB ONNX graph.
  yuv420: true
  # Compile VP dynamic NV12 resize and the detector into one FlexiBin. The
  # network still receives 3328x1024; runtime PicInfo may describe any input
  # up to this bound.
  hardware_resize:
    enabled: true
    dynamic: true
    max_width: 4096
    max_height: 2160
  # Used only when io.mode is 1 (picinfo). 9999 selects a centered ROI.
  roi_scale: 0
  roi_x: 9999
  roi_y: 9999
dra:
  # Dynamic range analysis (DRA) configuration used by Ambarella CVFlow.
  # mode: 2 = DRA v2, 3 = DRA v3. The default is 2.
  mode: 2
  # DRA v2 options: type=histo (default) or type=minmax, for example:
  #   type=histo,coverage_th=0.9,coverage_recover_th=0.0
  # DRA v3 option example:
  #   slope_psnr_end=30
  # Data-format options can force activation/coefficient precision:
  #   act-force-fx8, act-force-fx16, act-force-fp16, act-allow-fp16
  #   coeff-force-fx8, coeff-force-fx16, coeff-force-fp16, coeff-allow-fp16
  # The current policy forces both activation and coefficient to FX8.
  # coverage_th/coverage_recover_th do not apply when act/coeff is forced.
  options: act-force-fx8,coeff-force-fx8
# FlexiDAG I/O interface mode written to the generated model metadata:
# 0=raw/RECV_RAW, 1=picinfo/PIC_INFO, 2=plain tensor, 3=header v3.
# The converter maps this value to ADK's USR_SUPERDAG_TYPE and
# USR_HEADER_FLAG when invoking make.
io:
  # CV7/CVAPI v7 supports plain (2) and picinfo (1), not recv-raw (0).
  mode: 1
# Primary-output DRAM pitch alignment: 0=auto (CV7 defaults to 128-byte),
# 1=contiguous/word-aligned, 2=32-byte aligned, 3=64-byte aligned.
output:
  dram_pitch_alignment: 1
output_dir: modes/basketball/outputs/compile/ambarella
